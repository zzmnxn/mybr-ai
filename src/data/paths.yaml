# 실제로 확인한 공개 경로만 발행합니다.
- id: path-devwiki-build
  title: DevWiki 구축기
  summary: AI 에이전트의 작업 맥락을 이어가기 위해 시작한 개인 시스템이 어떻게 발전했는지, 구축 배경부터 설계 변화와 현재 아키텍처까지 기록한다.
  publishedOn: "2026-11-13"
  steps:
    - id: step-devwiki-why
      title: "1편 · 왜, 무엇을 위해 만들었나"
      description: 세션마다 끊기는 맥락과 사라지는 의사결정에서 출발해 Agent Memory와 Personal Wiki를 함께 만들기로 한 배경을 읽는다.
      noteUids:
        - hub-devwiki-why
    - id: step-devwiki-first-architecture
      title: "2편 · v1의 지식창고와 에이전트 메모리 설계"
      description: 번호 폴더와 운영 규칙, 구현하지 못한 메모리 명령, GitHub Actions로 시작한 Inbox 자동화를 읽는다.
      noteUids:
        - hub-devwiki-first-architecture
    - id: step-devwiki-v2-v3
      title: "3편 · v2·v3 이관과 첫 운영"
      description: Task 중심의 v2에서 엔트리 중심의 v3로 바꾸고, 첫 dev-memory 스킬과 검증을 보완한 과정을 읽는다.
      noteUids:
        - hub-devwiki-v2-v3
- id: path-cpp-containers
  title: C++ 컨테이너 고르기
  summary: vector에서 시작해 stack·queue, set, map까지 자료구조를 고르는 기준을 순서대로 읽는다.
  publishedOn: "2026-11-11"
  steps:
    - id: step-vector
      title: vector로 시작하기
      description: 가장 기본이 되는 순차 컨테이너의 동작과 쓰임을 먼저 정리한다.
      noteUids:
        - know-cpp-vector
    - id: step-stack-queue
      title: stack과 queue
      description: 넣고 빼는 순서가 정해진 자료구조를 이해한다.
      noteUids:
        - know-cpp-stack-queue
    - id: step-set
      title: 중복 없이 모으기
      description: set을 쓸지, vector에 unique를 쓸지 고르는 기준을 본다.
      noteUids:
        - know-cpp-set-vector-unique
    - id: step-map
      title: 키로 찾기
      description: 정렬되는 map과 해시 기반 unordered_map의 차이를 비교한다.
      noteUids:
        - know-cpp-map-unordered-map
- id: path-mybr-ai-build
  title: mybr.ai 만들기
  summary: 개발 기록을 연결하는 개인 지식 사이트의 구상부터 UI 개편과 학습 기록 기능 확장까지 따라간다.
  publishedOn: "2026-11-12"
  steps:
    - id: step-digital-brain-kickoff
      title: 디지털 두뇌 구상과 첫 배포
      description: 흩어진 개발 지식을 연결하려는 목적과 콘텐츠 구조, 기술 선택, 첫 배포 과정을 읽는다.
      noteUids:
        - hub-digital-brain-kickoff
    - id: step-digital-brain-evolution
      title: 지식이 쌓이는 과정 기록하기
      description: 테마와 UI를 개편하고 Activity, Paths, History로 학습 기록과 탐색 방식을 확장한 과정을 읽는다.
      noteUids:
        - hub-digital-brain-evolution
